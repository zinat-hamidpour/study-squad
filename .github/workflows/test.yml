name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Google Chrome is preinstalled on ubuntu-latest; installing a browser + apt deps can hang on slow mirrors
      - run: npm test
        env:
          PW_CHANNEL: chrome
